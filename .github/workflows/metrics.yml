name: Metrics

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Contribution calendar
        uses: lowlighter/metrics@366f8b9dfe3a59656c67d5dcad9950f59c9bc96d  # master 2026-09-23; pinned because the token has repo scope
        with:
          filename: metrics.calendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: MrGiveItAway-TPK
          base: ""
          config_timezone: Asia/Amman
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Profile overview
        uses: lowlighter/metrics@366f8b9dfe3a59656c67d5dcad9950f59c9bc96d  # master 2026-09-23; pinned because the token has repo scope
        with:
          filename: metrics.general.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: MrGiveItAway-TPK
          base: header, activity, community, repositories
          config_timezone: Asia/Amman
          repositories_affiliations: owner
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_notable: yes
          plugin_notable_from: all
          plugin_notable_repositories: yes
